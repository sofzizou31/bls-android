<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLS Liveness</title>

    <!--
        ① PATCH XHR + fetch AVANT tout autre script
           Équivalent de declarativeNetRequest de l'extension Chrome :
           injecte X-Forwarded-For + X-Real-IP sur TOUTES les requêtes
           vers ozforensics.com / jscrambler.com (GET ET POST).
           User-Agent est déjà géré par webView.settings.userAgentString (Android).
    -->
    <script>
    (function() {
        var DOMAINS = ['ozforensics.com', 'jscrambler.com'];
        var REFERER  = 'https://algeria.blsspainglobal.com/dza/appointment/livenessrequest';

        function isTarget(url) {
            if (!url) return false;
            for (var i = 0; i < DOMAINS.length; i++) {
                if (url.indexOf(DOMAINS[i]) !== -1) return true;
            }
            return false;
        }
        function getIp() {
            try { return (typeof Android !== 'undefined') ? Android.getIP() : 'N/A'; } catch(e) { return 'N/A'; }
        }

        /* ── Patch XMLHttpRequest ────────────────────────────────────── */
        var XHR           = XMLHttpRequest.prototype;
        var origOpen      = XHR.open;
        var origSetHeader = XHR.setRequestHeader;
        var origSend      = XHR.send;

        XHR.open = function() {
            this._patchUrl     = String(arguments[1] || '');
            this._patchHeaders = {};
            return origOpen.apply(this, arguments);
        };
        XHR.setRequestHeader = function(name) {
            if (this._patchHeaders) this._patchHeaders[name.toLowerCase()] = true;
            return origSetHeader.apply(this, arguments);
        };
        XHR.send = function(body) {
            if (isTarget(this._patchUrl)) {
                var ip = getIp();
                if (ip && ip !== 'N/A') {
                    if (!this._patchHeaders['x-forwarded-for'])
                        try { origSetHeader.call(this, 'X-Forwarded-For', ip); } catch(e) {}
                    if (!this._patchHeaders['x-real-ip'])
                        try { origSetHeader.call(this, 'X-Real-IP', ip);       } catch(e) {}
                }
                /* Referer est un header interdit en JS mais on essaie quand même */
                if (!this._patchHeaders['referer'])
                    try { origSetHeader.call(this, 'Referer', REFERER); } catch(e) {}
            }
            return origSend.apply(this, [body]);
        };

        /* ── Patch fetch ─────────────────────────────────────────────── */
        var origFetch = window.fetch;
        if (origFetch) {
            window.fetch = function(input, init) {
                var url = (typeof input === 'string') ? input
                        : (input && input.url) ? input.url : '';
                if (isTarget(url)) {
                    var ip = getIp();
                    init = init ? Object.assign({}, init) : {};
                    var h = {};
                    if (init.headers) {
                        if (typeof init.headers.forEach === 'function') {
                            /* Headers object */
                            init.headers.forEach(function(v, k) { h[k] = v; });
                        } else {
                            h = Object.assign({}, init.headers);
                        }
                    }
                    if (ip && ip !== 'N/A') {
                        if (!h['x-forwarded-for'] && !h['X-Forwarded-For'])
                            h['X-Forwarded-For'] = ip;
                        if (!h['x-real-ip'] && !h['X-Real-IP'])
                            h['X-Real-IP'] = ip;
                    }
                    init.headers = h;
                }
                return origFetch.call(window, input, init);
            };
        }

        console.log('[BLS] XHR/fetch patch actif pour:', DOMAINS.join(', '));
    })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #07111f, #0f2a44);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #loader {
            width: 60px; height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #f5d27a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status {
            font-size: 16px;
            color: #f5d27a;
            max-width: 300px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="loader"></div>
    <div id="status">Initialisation...</div>

    <script>
    (function() {
        'use strict';

        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        function loadScript(url) {
            return new Promise(function(resolve, reject) {
                var s = document.createElement('script');
                s.src = url;
                s.onload = resolve;
                s.onerror = function() { reject(new Error('Erreur chargement: ' + url)); };
                document.head.appendChild(s);
            });
        }

        async function init() {
            try {
                /* Données injectées par l'app Android via JavascriptInterface */
                var uid = Android.getUID();
                var tid = Android.getTID();
                var ip  = Android.getIP();
                var ua  = Android.getUA();

                setStatus('Chargement du SDK selfie...');

                /* CSS OzForensics */
                var css = document.createElement('link');
                css.rel  = 'stylesheet';
                css.href = 'https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin/liveness-81ab90655a.css?ver=1.8.1-10';
                document.head.appendChild(css);

                /* Scripts OzForensics (même ordre que l'extension Chrome) */
                await loadScript('https://code.jquery.com/jquery-3.6.0.min.js');
                await loadScript('https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin/ozliveness_main.js?ver=1.8.1-10');
                await loadScript('https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin_liveness.php?ver=1.8.1-10');

                setStatus('Préparation du selfie...');

                /* Attendre OzLiveness (poll 500ms × 120 = 60s max) */
                var attempts = 0;
                var checkOz = setInterval(function() {
                    attempts++;
                    if (typeof OzLiveness !== 'undefined' && typeof OzLiveness.open === 'function') {
                        clearInterval(checkOz);
                        launchOz(uid, tid, ip, ua);
                    } else if (attempts >= 120) {
                        clearInterval(checkOz);
                        setStatus('Erreur : SDK non chargé (timeout)');
                        Android.onLivenessError('Timeout: OzLiveness non disponible');
                    }
                }, 500);

            } catch (e) {
                setStatus('Erreur : ' + e.message);
                Android.onLivenessError(e.message);
            }
        }

        function launchOz(uid, tid, ip, ua) {
            document.getElementById('loader').style.display = 'none';
            setStatus('Prêt — selfie en cours...');

            var config = {
                lang: 'en',
                meta: {
                    user_id:        uid,
                    transaction_id: tid
                },
                overlay_options: false,
                action: ['video_selfie_blank'],
                headers: {}
            };

            /* headers au niveau SDK (même chose que l'extension Chrome) */
            if (ip && ip !== 'N/A') {
                config.headers['X-Forwarded-For'] = ip;
                config.headers['X-Real-IP']       = ip;
            }
            if (ua && ua !== 'N/A') {
                config.headers['User-Agent'] = ua;
            }
            config.headers['Referer'] = 'https://algeria.blsspainglobal.com/dza/appointment/livenessrequest';

            if (Object.keys(config.headers).length === 0) delete config.headers;

            config.on_complete = function(result) {
                var livenessId = result.event_session_id ||
                                 result.session_id       ||
                                 result.liveness_id      ||
                                 result.LivenessId       ||
                                 result.id;
                if (livenessId) {
                    setStatus('✅ Selfie terminé !');
                    Android.onLivenessComplete(livenessId);
                } else {
                    setStatus('Erreur : ID introuvable');
                    Android.onLivenessError('Liveness ID manquant: ' + JSON.stringify(result));
                }
            };

            config.on_error = function(error) {
                setStatus('Erreur selfie');
                Android.onLivenessError(JSON.stringify(error));
            };

            OzLiveness.open(config);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
