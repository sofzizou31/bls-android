<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLS Liveness</title>

    <!--
        ① PATCH XHR + fetch AVANT tout autre script.
        Garantit X-Forwarded-For + X-Real-IP sur TOUTES les requêtes
        (GET ET POST) vers ozforensics.com et jscrambler.com.
        Équivalent de declarativeNetRequest de l'extension Chrome.
        NE PAS ajouter Referer ici : header interdit → crash silencieux SDK.
    -->
    <script>
    (function() {
        var TARGETS = ['ozforensics.com', 'jscrambler.com'];
        function hit(url) {
            return false; // Patch JS désactivé : cause CORS preflight → selfie ne se lance pas
        }
        function ip() {
            try { return (typeof Android !== 'undefined') ? Android.getIP() : 'N/A'; }
            catch(e) { return 'N/A'; }
        }

        var XHR      = XMLHttpRequest.prototype;
        var origOpen = XHR.open;
        var origSet  = XHR.setRequestHeader;
        var origSend = XHR.send;
        XHR.open = function() {
            this._pUrl = String(arguments[1] || '');
            this._pH   = {};
            return origOpen.apply(this, arguments);
        };
        XHR.setRequestHeader = function(n) {
            if (this._pH) this._pH[n.toLowerCase()] = 1;
            return origSet.apply(this, arguments);
        };
        XHR.send = function(body) {
            if (hit(this._pUrl) && !this.withCredentials) {
                var v = ip();
                try { if(typeof Android!=='undefined') Android.sendLog('🌐 XHR: '+this._pUrl.split('?')[0].replace(/^https?:\/\/[^/]+/,'').substring(0,80)); } catch(e2){}
                if (v && v !== 'N/A') {
                    if (!this._pH['x-forwarded-for'])
                        try { origSet.call(this, 'X-Forwarded-For', v); } catch(e) {}
                    if (!this._pH['x-real-ip'])
                        try { origSet.call(this, 'X-Real-IP', v); } catch(e) {}
                }
            }
            return origSend.apply(this, [body]);
        };

        if (window.fetch) {
            var origFetch = window.fetch;
            window.fetch = function(input, init) {
                var url = typeof input === 'string' ? input
                        : (input && input.url) ? input.url : '';
                if (hit(url) && !(init && init.credentials === 'include')) {
                    var v = ip();
                    try { if(typeof Android!=='undefined') Android.sendLog('🌐 fetch: '+url.split('?')[0].replace(/^https?:\/\/[^/]+/,'').substring(0,80)); } catch(e2){}
                    if (v && v !== 'N/A') {
                        init = init ? Object.assign({}, init) : {};
                        var h = {};
                        if (init.headers) {
                            if (typeof init.headers.forEach === 'function')
                                init.headers.forEach(function(val, key) { h[key] = val; });
                            else
                                h = Object.assign({}, init.headers);
                        }
                        if (!h['x-forwarded-for'] && !h['X-Forwarded-For'])
                            h['X-Forwarded-For'] = v;
                        if (!h['x-real-ip'] && !h['X-Real-IP'])
                            h['X-Real-IP'] = v;
                        init.headers = h;
                    }
                }
                return origFetch.call(window, input, init)['catch'](function(err) {
                    try { if(typeof Android!=='undefined') Android.sendLog('❌ fetch FAIL [' + url.replace(/^https?:\/\//, '').substring(0, 90) + ']: ' + (err && err.message ? err.message : String(err))); } catch(e2){}
                    throw err;
                });
            };
        }
    })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: auto;
        }
        body {
            background: linear-gradient(135deg, #07111f, #0f2a44);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #loader {
            width: 60px; height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #f5d27a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status {
            font-size: 16px;
            color: #f5d27a;
            max-width: 300px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="loader"></div>
    <div id="status">Initialisation...</div>

    <script>
    (function() {
        'use strict';

        function setStatus(msg) {
            var s = document.getElementById('status');
            if (s) s.textContent = msg;
        }

        function log(msg) {
            console.log('[BLS] ' + msg);
            try { Android.sendLog(msg); } catch(e) {}
        }

        function loadScript(url) {
            var short = url.split('/').pop().split('?')[0];
            return new Promise(function(resolve, reject) {
                log('⏳ Chargement: ' + short);
                var s = document.createElement('script');
                s.src = url;
                s.onload = function() {
                    log('✅ Chargé: ' + short);
                    resolve();
                };
                s.onerror = function() {
                    log('❌ ERREUR chargement: ' + short);
                    reject(new Error('Erreur chargement: ' + url));
                };
                document.head.appendChild(s);
            });
        }

        function sleep(ms) {
            return new Promise(function(r) { setTimeout(r, ms); });
        }

        async function init() {
            window.onerror = function(msg, src, line) {
                log('💥 JS Error: ' + msg + ' [' + (src||'').split('/').pop() + ':' + line + ']');
            };
            window.addEventListener('unhandledrejection', function(e) {
                log('💥 Promise rejetée: ' + (e.reason ? (e.reason.message || String(e.reason)).substring(0,120) : '?'));
            });
            try {
                var uid = Android.getUID();
                var tid = Android.getTID();
                var ip  = Android.getIP();
                var ua  = Android.getUA();

                log('🚀 Init\n'
                  + '👤 UID: ' + (uid !== 'N/A' ? uid.substring(0,12)+'...' : 'N/A') + '\n'
                  + '🔑 TID: ' + (tid !== 'N/A' ? tid.substring(0,12)+'...' : 'N/A') + '\n'
                  + '🌐 IP: ' + ip + '\n'
                  + '🔧 UA: ' + (ua !== 'N/A' ? ua.substring(0,60)+'...' : 'N/A'));

                setStatus('Chargement du SDK selfie...');

                var css = document.createElement('link');
                css.rel  = 'stylesheet';
                css.href = 'https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin/liveness-81ab90655a.css?ver=1.8.1-10';
                document.head.appendChild(css);

                await sleep(1000);

                await loadScript('https://code.jquery.com/jquery-3.6.0.min.js');
                await sleep(500);

                await loadScript('https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin/ozliveness_main.js?ver=1.8.1-10');
                await sleep(500);

                await loadScript('https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin_liveness.php?ver=1.8.1-10');

                log('📦 Tous scripts chargés — attente OzLiveness...');
                setStatus('Préparation du selfie...');

                var attempts = 0;
                var checkOz = setInterval(function() {
                    attempts++;
                    if (typeof OzLiveness !== 'undefined' && typeof OzLiveness.open === 'function') {
                        clearInterval(checkOz);
                        log('✅ OzLiveness prêt après ' + attempts + ' tentatives');
                        launchOz(uid, tid, ip, ua);
                    } else if (attempts >= 120) {
                        clearInterval(checkOz);
                        log('❌ TIMEOUT: OzLiveness jamais défini après 60s\n'
                          + 'typeof OzLiveness = ' + typeof OzLiveness);
                        setStatus('Erreur : SDK non chargé (timeout)');
                        Android.onLivenessError('Timeout: OzLiveness non disponible');
                    }
                }, 500);

            } catch (e) {
                log('❌ EXCEPTION init: ' + e.message);
                setStatus('Erreur : ' + e.message);
                Android.onLivenessError(e.message);
            }
        }

        function launchOz(uid, tid, ip, ua) {
            document.getElementById('loader').style.display = 'none';
            setStatus('Prêt — selfie en cours...');
            document.body.style.overflow = 'auto';

            // config.headers supprimé : X-Forwarded-For en JS déclenche CORS preflight → fail
            // Les headers sont injectés au niveau réseau par shouldInterceptRequest (Kotlin)
            var config = {
                lang: 'en',
                meta: { user_id: uid, transaction_id: tid },
                overlay_options: false,
                action: ['video_selfie_blank']
            };

            log('🎯 OzLiveness.open()\n'
              + '👤 user_id: ' + uid + '\n'
              + '🔑 transaction_id: ' + tid + '\n'
              + '🌐 IP injectée via shouldInterceptRequest: ' + ip + '\n'
              + '🔧 config.headers: SUPPRIMÉ (anti-CORS)\n'
              + '🔒 isSecureContext: ' + window.isSecureContext + '\n'
              + '📷 mediaDevices: ' + (navigator.mediaDevices ? 'oui' : 'NON') + '\n'
              + '🔑 OZ keys: ' + Object.keys(OzLiveness).join(', '));

            config.on_complete = function(result) {
                var full = JSON.stringify(result);
                log('✅ on_complete: ' + full);
                var livenessId = result.event_session_id ||
                                 result.session_id       ||
                                 result.liveness_id      ||
                                 result.LivenessId       ||
                                 result.id               ||
                                 result.result           ||
                                 (result.data && result.data.liveness_id) ||
                                 (result.meta && result.meta.liveness_id);
                if (livenessId) {
                    setStatus('✅ Selfie terminé !');
                    Android.onLivenessComplete(livenessId);
                } else {
                    setStatus('Erreur : ID introuvable');
                    Android.onLivenessError('on_complete sans ID: ' + full);
                }
            };

            config.on_error = function(error) {
                var detail;
                try {
                    if (error == null)             detail = 'null (SDK fermé sans détail)';
                    else if (error instanceof Error) detail = error.name + ': ' + error.message;
                    else if (typeof error === 'string') detail = error;
                    else detail = JSON.stringify(error);
                } catch(e) { detail = String(error); }
                log('❌ on_error: ' + detail);
                setStatus('❌ ' + detail.substring(0, 150));
                Android.onLivenessError(detail);
            };

            try {
                OzLiveness.open(config);
                log('📡 open() exécuté — attente UI caméra...');
            } catch(e) {
                log('❌ open() exception: ' + e.message);
                Android.onLivenessError('open() exception: ' + e.message);
            }

            setTimeout(function() {
                var els = document.querySelectorAll('iframe,canvas,video');
                log('⏱️ +5s DOM: ' + els.length + ' (iframe/canvas/video)'
                  + ' | body.children=' + document.body.children.length
                  + ' | isSecureContext=' + window.isSecureContext);
            }, 5000);

            setTimeout(function() {
                var els = document.querySelectorAll('iframe,canvas,video');
                if (els.length === 0) {
                    log('⚠️ +15s: Aucun UI selfie — SDK muet. Fermé ? Erreur réseau ?');
                } else {
                    log('✅ +15s: ' + els.length + ' éléments visuels présents');
                }
            }, 15000);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
