<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLS Liveness</title>

    <!--
        ① PATCH XHR + fetch AVANT tout autre script.
        Garantit X-Forwarded-For + X-Real-IP sur TOUTES les requêtes
        (GET ET POST) vers ozforensics.com et jscrambler.com.
        Équivalent de declarativeNetRequest de l'extension Chrome.
        NE PAS ajouter Referer ici : header interdit → crash silencieux SDK.
    -->
    <script>
    (function() {
        var TARGETS = ['ozforensics.com', 'jscrambler.com'];
        function hit(url) {
            if (!url) return false;
            for (var i = 0; i < TARGETS.length; i++)
                if (url.indexOf(TARGETS[i]) !== -1) return true;
            return false;
        }
        function ip() {
            try { return (typeof Android !== 'undefined') ? Android.getIP() : 'N/A'; }
            catch(e) { return 'N/A'; }
        }

        var XHR      = XMLHttpRequest.prototype;
        var origOpen = XHR.open;
        var origSet  = XHR.setRequestHeader;
        var origSend = XHR.send;
        XHR.open = function() {
            this._pUrl = String(arguments[1] || '');
            this._pH   = {};
            return origOpen.apply(this, arguments);
        };
        XHR.setRequestHeader = function(n) {
            if (this._pH) this._pH[n.toLowerCase()] = 1;
            return origSet.apply(this, arguments);
        };
        XHR.send = function(body) {
            if (hit(this._pUrl)) {
                var v = ip();
                if (v && v !== 'N/A') {
                    if (!this._pH['x-forwarded-for'])
                        try { origSet.call(this, 'X-Forwarded-For', v); } catch(e) {}
                    if (!this._pH['x-real-ip'])
                        try { origSet.call(this, 'X-Real-IP', v); } catch(e) {}
                }
            }
            return origSend.apply(this, [body]);
        };

        if (window.fetch) {
            var origFetch = window.fetch;
            window.fetch = function(input, init) {
                var url = typeof input === 'string' ? input
                        : (input && input.url) ? input.url : '';
                if (hit(url)) {
                    var v = ip();
                    if (v && v !== 'N/A') {
                        init = init ? Object.assign({}, init) : {};
                        var h = {};
                        if (init.headers) {
                            if (typeof init.headers.forEach === 'function')
                                init.headers.forEach(function(val, key) { h[key] = val; });
                            else
                                h = Object.assign({}, init.headers);
                        }
                        if (!h['x-forwarded-for'] && !h['X-Forwarded-For'])
                            h['X-Forwarded-For'] = v;
                        if (!h['x-real-ip'] && !h['X-Real-IP'])
                            h['X-Real-IP'] = v;
                        init.headers = h;
                    }
                }
                return origFetch.call(window, input, init);
            };
        }
    })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: auto;
        }
        body {
            background: linear-gradient(135deg, #07111f, #0f2a44);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #loader {
            width: 60px; height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #f5d27a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status {
            font-size: 16px;
            color: #f5d27a;
            max-width: 300px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="loader"></div>
    <div id="status">Initialisation...</div>

    <script>
    (function() {
        'use strict';

        function setStatus(msg) {
            var s = document.getElementById('status');
            if (s) s.textContent = msg;
        }

        function loadScript(url) {
            return new Promise(function(resolve, reject) {
                console.log('[BLS] Chargement: ' + url);
                var s = document.createElement('script');
                s.src = url;
                s.onload = function() {
                    console.log('[BLS] Chargé: ' + url);
                    resolve();
                };
                s.onerror = function() {
                    console.error('[BLS] Erreur chargement: ' + url);
                    reject(new Error('Erreur chargement: ' + url));
                };
                document.head.appendChild(s);
            });
        }

        function sleep(ms) {
            return new Promise(function(r) { setTimeout(r, ms); });
        }

        async function init() {
            try {
                var uid = Android.getUID();
                var tid = Android.getTID();
                var ip  = Android.getIP();
                var ua  = Android.getUA();

                console.log('[BLS] init', {
                    uid: uid ? uid.substring(0, 8) + '...' : 'N/A',
                    tid: tid ? tid.substring(0, 8) + '...' : 'N/A',
                    ip:  ip,
                    ua:  ua ? ua.substring(0, 50) + '...' : 'N/A'
                });

                setStatus('Chargement du SDK selfie...');

                /* ─── 1. CSS d'abord, seul (comme l'extension) ─── */
                var css = document.createElement('link');
                css.rel  = 'stylesheet';
                css.href = 'https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin/liveness-81ab90655a.css?ver=1.8.1-10';
                document.head.appendChild(css);

                /* ─── 2. Attendre 1s pour que le CSS soit traité (extension fait pareil) ─── */
                await sleep(1000);

                /* ─── 3. Scripts dans le MÊME ordre que l'extension, avec délais de 500ms ─── */
                await loadScript('https://code.jquery.com/jquery-3.6.0.min.js');
                await sleep(500);

                await loadScript('https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin/ozliveness_main.js?ver=1.8.1-10');
                await sleep(500);

                await loadScript('https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin_liveness.php?ver=1.8.1-10');

                setStatus('Préparation du selfie...');

                /* ─── 4. Polling OzLiveness toutes les 500ms (max 60s) ─── */
                var attempts = 0;
                var checkOz = setInterval(function() {
                    attempts++;
                    if (typeof OzLiveness !== 'undefined' && typeof OzLiveness.open === 'function') {
                        clearInterval(checkOz);
                        console.log('[BLS] OzLiveness détecté après ' + attempts + ' tentatives');
                        launchOz(uid, tid, ip, ua);
                    } else if (attempts >= 120) {
                        clearInterval(checkOz);
                        setStatus('Erreur : SDK non chargé (timeout)');
                        Android.onLivenessError('Timeout: OzLiveness non disponible');
                    }
                }, 500);

            } catch (e) {
                console.error('[BLS] init error:', e);
                setStatus('Erreur : ' + e.message);
                Android.onLivenessError(e.message);
            }
        }

        function launchOz(uid, tid, ip, ua) {
            document.getElementById('loader').style.display = 'none';
            setStatus('Prêt — selfie en cours...');

            /* Body overflow auto (comme content_favicon.js de l'extension) */
            document.body.style.overflow = 'auto';

            /* Config IDENTIQUE à l'extension (background.js lignes 409-436) */
            var config = {
                lang: 'en',
                meta: {
                    user_id:        uid,
                    transaction_id: tid
                },
                overlay_options: false,
                action: ['video_selfie_blank'],
                headers: {}
            };

            if (ip && ip !== 'N/A' && ip !== 'undefined' && ip !== '') {
                config.headers['X-Forwarded-For'] = ip;
                config.headers['X-Real-IP']       = ip;
                console.log('[BLS] Headers IP:', ip);
            }
            if (ua && ua !== 'N/A' && ua !== '' && ua !== 'undefined') {
                config.headers['User-Agent'] = ua;
                console.log('[BLS] User-Agent:', ua.substring(0, 60) + '...');
            }
            if (Object.keys(config.headers).length === 0) {
                delete config.headers;
                console.log('[BLS] Aucun header personnalisé');
            } else {
                console.log('[BLS] config.headers:', JSON.stringify(config.headers));
            }

            config.on_complete = function(result) {
                console.log('[BLS] on_complete:', JSON.stringify(result));
                var livenessId = result.event_session_id ||
                                 result.session_id       ||
                                 result.liveness_id      ||
                                 result.LivenessId       ||
                                 result.id               ||
                                 result.result           ||
                                 (result.data && result.data.liveness_id) ||
                                 (result.meta && result.meta.liveness_id);
                if (livenessId) {
                    setStatus('✅ Selfie terminé !');
                    Android.onLivenessComplete(livenessId);
                } else {
                    var detail = JSON.stringify(result);
                    setStatus('Erreur : ID introuvable — ' + detail.substring(0, 80));
                    Android.onLivenessError('on_complete sans ID: ' + detail);
                }
            };

            config.on_error = function(error) {
                /* Sérialisation robuste : Error native, objet, string ou null */
                var detail;
                try {
                    if (error == null) detail = 'null (SDK a fermé sans détail)';
                    else if (error instanceof Error) detail = error.name + ': ' + error.message;
                    else if (typeof error === 'string') detail = error;
                    else detail = JSON.stringify(error);
                } catch(e) {
                    detail = String(error);
                }
                console.error('[BLS] on_error:', detail);
                setStatus('❌ ' + detail.substring(0, 150));
                Android.onLivenessError(detail);
            };

            console.log('[BLS] OzLiveness.open() appelé');
            OzLiveness.open(config);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
