name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Télécharger Gradle 8.0 et générer le wrapper (gradlew non commité)
      - name: Download Gradle 8.0 & generate wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.0/bin/gradle wrapper --gradle-version 8.0 --distribution-type bin -p .
          chmod +x gradlew

      # Injecter google-services.json depuis le secret GitHub
      - name: Injecter google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # Injecter les secrets dans secrets.properties
      - name: Injecter secrets.properties
        run: |
          printf 'GITHUB_TOKEN=%s\nTELEGRAM_BOT=%s\nTELEGRAM_CHAT=%s\nWORKER_URL=%s\n' \
            '${{ secrets.APP_GITHUB_TOKEN }}' \
            '${{ secrets.TELEGRAM_BOT }}' \
            '${{ secrets.TELEGRAM_CHAT }}' \
            '${{ secrets.WORKER_URL }}' > secrets.properties

      - name: Build APK (debug)
        run: ./gradlew assembleDebug --stacktrace

      # Publier l'APK en artifact téléchargeable
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLSVisa-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
